<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Solabliss</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: {
  sola: { 400:'#fdba74',500:'#FC6D05',600:'#E25800',700:'#C2410C' }, ink: { 800:'#141417',900:'#0b0b0d' }
}}}};
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="text-slate-200 antialiased">

<main class="pt-28 pb-24 max-w-7xl mx-auto px-5">
  <p class="text-sola-400 font-semibold tracking-widest text-sm uppercase">Portfolio</p>
  <h1 class="mt-2 text-3xl md:text-4xl font-semibold tracking-tight text-white">Projects & jobs done</h1>
  <p class="mt-3 text-slate-400 max-w-2xl">Browse our completed work by town — each site shows what the client had, what they needed, what we installed and what it cost.</p>

  <!-- breadcrumb -->
  <div id="crumbs" class="mt-8 text-sm text-slate-400"></div>

  <!-- towns grid -->
  <div id="townsView" class="mt-6 grid sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>

  <!-- sites in selected town -->
  <div id="sitesView" class="hidden mt-6 grid md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</main>

<!-- site detail modal -->
<div id="siteModal" class="hidden fixed inset-0 z-[60] bg-black/75 backdrop-blur-sm grid place-items-center p-4 overflow-y-auto">
  <div class="card w-full max-w-3xl my-8">
    <div class="flex justify-between items-start mb-4">
      <div>
        <h3 id="dTitle" class="font-extrabold text-2xl text-white"></h3>
        <p id="dMeta" class="text-sm text-slate-400 mt-1"></p>
      </div>
      <button onclick="siteModal.classList.add('hidden')" class="text-3xl text-slate-400 hover:text-white leading-none">×</button>
    </div>
    <div id="dBody"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/projects.js"></script>
</body>
</html>
